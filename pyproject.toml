[project]
name = "cse250a"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "tqdm>=4.70.1",
]

# `uv sync` installs this as the `cse250a` command, so no separate run script is needed.
# Add new subcommands/flags in src/cse250a/cli.py.
[project.scripts]
cse250a = "cse250a.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "nbstripout>=0.9.1",
    "ruff>=0.17.0",
]

[tool.ruff.lint.per-file-ignores]
# Notebooks start with the README's setup cell, which imports config before it's used.
"*.ipynb" = ["F401"]
