name: checks
on: [pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - name: Notebooks have no outputs
        run: find notebooks -name '*.ipynb' -print0 | xargs -0 -r uv run nbstripout --verify